name: Build PhonePod

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      THEOS: /home/runner/theos

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Theos + toolchain
        run: |
          bash -c "$(curl -fsSL https://raw.githubusercontent.com/theos/theos/master/bin/install-theos)"
          ls "$THEOS/makefiles/common.mk"
          ls "$THEOS/toolchain/linux/iphone/bin" | head -5

      - name: Build libplist from source
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake libxml2-dev python3-dev
          cd /tmp
          git clone https://github.com/libimobiledevice/libplist.git
          cd libplist
          ./autogen.sh --prefix=/usr
          make
          sudo make install
          sudo ldconfig

      - name: Fetch iOS 8.4 SDK
        run: |
          mkdir -p "$THEOS/sdks"

          fetch_sdk() {
            local repo="$1"
            rm -rf /tmp/sdks
            git clone -n --depth=1 --filter=tree:0 "$repo" /tmp/sdks || return 1
            cd /tmp/sdks
            git sparse-checkout set --no-cone iPhoneOS8.4.sdk || return 1
            git checkout || return 1
            [ -d iPhoneOS8.4.sdk ] || return 1
            cp -r iPhoneOS8.4.sdk "$THEOS/sdks/"
            cd -
          }

          fetch_sdk https://github.com/Lessica/iPhoneOS-SDKs \
            || fetch_sdk https://github.com/okanon/iPhoneOS.sdk

          if [ ! -d "$THEOS/sdks/iPhoneOS8.4.sdk" ]; then
            echo "::error::Failed to fetch iPhoneOS8.4.sdk"
            exit 1
          fi
          ls "$THEOS/sdks/iPhoneOS8.4.sdk" | head -20

      - name: Build PhonePod
        run: |
          export PATH="$THEOS/toolchain/linux/iphone/bin:$PATH"
          make package FINALPACKAGE=1

      - name: Convert deb to ipa
        run: |
          mkdir -p Payload
          dpkg-deb -x packages/*.deb extracted
          APP_PATH=$(find extracted -name "*.app" -type d | head -1)
          cp -r "$APP_PATH" Payload/
          zip -r PhonePod.ipa Payload
          mkdir -p packages
          mv PhonePod.ipa packages/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: PhonePod-ipa
          path: packages/*.ipa
          if-no-files-found: error

      - name: Determine next version
        id: version
        run: |
          LAST_MINOR=$(git tag --list 'v0.*.0' | sed -E 's/^v0\.([0-9]+)\.0$/\1/' | sort -n | tail -n1)
          if [ -z "$LAST_MINOR" ]; then
            NEXT_MINOR=1
          else
            NEXT_MINOR=$((LAST_MINOR + 1))
          fi
          VERSION="0.${NEXT_MINOR}.0"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Rename ipa with version
        run: |
          mkdir -p release
          cp packages/PhonePod.ipa "release/PhonePod-${{ steps.version.outputs.version }}.ipa"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ steps.version.outputs.tag }}" \
            "release/PhonePod-${{ steps.version.outputs.version }}.ipa" \
            --title "PhonePod ${{ steps.version.outputs.tag }}" \
            --notes "Автоматическая сборка из commit ${{ github.sha }}"
