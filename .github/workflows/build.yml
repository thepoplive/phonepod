name: Build PhonePod

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      THEOS: /home/runner/theos

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Theos + toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y curl git perl sudo make fakeroot rsync
          bash -c "$(curl -fsSL https://raw.githubusercontent.com/theos/theos/master/bin/install-linux.sh)"

      - name: Fetch iOS 8.4 SDK
        run: |
          mkdir -p "$THEOS/sdks"

          fetch_sdk() {
            local repo="$1"
            rm -rf /tmp/sdks
            git clone -n --depth=1 --filter=tree:0 "$repo" /tmp/sdks || return 1
            cd /tmp/sdks
            git sparse-checkout set --no-cone iPhoneOS8.4.sdk || return 1
            git checkout || return 1
            [ -d iPhoneOS8.4.sdk ] || return 1
            cp -r iPhoneOS8.4.sdk "$THEOS/sdks/"
            cd -
          }

          # theos/sdks официально начинается с 9.3, восьмёрки там нет — используем зеркала
          fetch_sdk https://github.com/Lessica/iPhoneOS-SDKs \
            || fetch_sdk https://github.com/okanon/iPhoneOS.sdk

          if [ ! -d "$THEOS/sdks/iPhoneOS8.4.sdk" ]; then
            echo "::error::Не удалось получить iPhoneOS8.4.sdk ни из одного источника"
            exit 1
          fi
          ls "$THEOS/sdks/iPhoneOS8.4.sdk" | head -20

      - name: Build PhonePod.ipa
        run: |
          export PATH="$THEOS/toolchain/linux/iphone/bin:$PATH"
          make package FINALPACKAGE=1

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: PhonePod-ipa
          path: packages/*.ipa
          if-no-files-found: error
